<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>北海道スキー司令室 2026</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101923;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}header{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(20px,3vw,30px);margin:0}small,.hint{color:#a6bbcc}main{padding:0 16px 24px;max-width:1600px;margin:auto}.tabs{display:flex;gap:8px;margin:12px 0 16px}.tabs button{border:1px solid #4b6377;background:#203246;color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer}.tabs button.active{background:#126a9b;border-color:#51b6e5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr}}.card{background:#1d2d3e;border:1px solid #3a5064;border-radius:14px;overflow:hidden}.card h2{font-size:15px;margin:0;padding:12px 14px}.media{aspect-ratio:16/9;background:#0a1119;display:flex;align-items:center;justify-content:center;position:relative}.media iframe,.media img{width:100%;height:100%;border:0;object-fit:contain}.placeholder{color:#9eb1c0;text-align:center;padding:15px;font-size:13px}.actions{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions a,.actions button{color:#b8e6ff;background:#243f54;border:1px solid #476b83;border-radius:7px;padding:7px 10px;text-decoration:none;font-size:13px;cursor:pointer}.note{font-size:12px;color:#b1c1cf;margin:12px 2px}.hidden{display:none}</style></head><body><header><div><small>HOKKAIDO SKI COMMAND CENTER</small><h1>北海道スキー司令室 2026</h1></div><small>12/5–12/19</small></header><main><nav class="tabs"><button class="active" data-tab="central">道央｜小樽・札幌</button><button data-tab="north">道北｜旭川</button></nav><div id="grid" class="grid"></div><p class="note">YouTubeは再生ボタンを押すと読み込みます。配信者が埋め込みを禁止している場合は「元サイト」で開いてください。静止画URLが日付入りのカメラは自動更新できません。</p></main><script>
const cameras={central:[
{name:'キロロ｜ベースエリア',type:'youtube',id:'q96NwhD6Lrw'},
{name:'キロロ｜朝里岳山頂',type:'youtube',id:'qtU23CdE7mU'},
{name:'キロロ｜長峰第2',type:'youtube',id:'RVblxnP4Ry8'},
{name:'ニセコ｜グラン・ヒラフ',type:'youtube',id:'taDZzy8yMTw'},
{name:'ニセコ｜アンヌプリ',type:'youtube',id:'z4xJYd7931A'},
{name:'ニセコ｜ビレッジ',type:'youtube',id:'WMAL8MGGnRg'},
{name:'ニセコ｜HANAZONO',type:'youtube',id:'1ksmiy6EsDo'},
{name:'札幌国際｜URL未登録',type:'pending'},
{name:'ルスツ｜URL未登録',type:'pending'}],north:[
{name:'富良野｜11/4取得画像（固定）',type:'image',url:'https://storage.googleapis.com/skiday-livecam-prod.appspot.com/camera_images/869223040349118/20261104113846.jpg',source:'https://skiday.app/livecam/furano'},
{name:'カムイリンクス｜Powdercam',type:'link',url:'https://powdercam.net/app/show.php?serial_number=00000000ab91a18b&time=1708579279988'},
{name:'旭岳｜URL未登録',type:'pending'},
{name:'ぴっぷ｜URL未登録',type:'pending'}]};
const grid=document.getElementById('grid');function render(tab){grid.replaceChildren();for(const c of cameras[tab]){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=c.name;card.append(title);const media=document.createElement('div');media.className='media';card.append(media);const actions=document.createElement('div');actions.className='actions';card.append(actions);if(c.type==='youtube'){const p=document.createElement('div');p.className='placeholder';p.textContent='▶ タップしてライブ映像を読み込む';media.append(p);const play=document.createElement('button');play.textContent='▶ 再生';play.onclick=()=>{media.replaceChildren();const f=document.createElement('iframe');f.src=`https://www.youtube.com/embed/${c.id}?autoplay=1&mute=1&playsinline=1`;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.referrerPolicy='strict-origin-when-cross-origin';f.allowFullscreen=true;f.title=c.name;media.append(f)};actions.append(play);link(actions,`https://www.youtube.com/live/${c.id}`,'YouTubeで開く')}else if(c.type==='image'){const img=document.createElement('img');img.src=c.url;img.alt=c.name;img.onerror=()=>{media.textContent='画像を表示できません。元サイトをご覧ください。'};media.append(img);link(actions,c.source,'最新画像の掲載元')}else if(c.type==='link'){const p=document.createElement('div');p.className='placeholder';p.textContent='外部ページの埋め込みは未検証';media.append(p);link(actions,c.url,'Powdercamを開く')}else{const p=document.createElement('div');p.className='placeholder';p.textContent='ライブカメラURLを追加予定';media.append(p)}grid.append(card)}}function link(parent,url,label){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;parent.append(a)}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.tab)}));render('central');
</script></body></html>
